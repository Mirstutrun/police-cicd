<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Добавить улику</title></head>
<body>
    <h1>Добавление улики</h1>
    <form action="/add_evidence" method="POST">
        <label>Название:</label><br><input type="text" name="item_name" required><br><br>
        <label>Описание:</label><br><textarea name="description"></textarea><br><br>
        <label>Прикрепить к делу:</label><br>
        <select name="case_id">{% for case in cases %}<option value="{{ case.id }}">{{ case.title }}</option>{% endfor %}</select><br><br>
        <button type="submit">Добавить</button>
    </form>
</body>
</html>
