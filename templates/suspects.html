<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Подозреваемые</title></head>
<body>
    <h1>База подозреваемых</h1>
    <a href="/">На главную</a> | <a href="/add_suspect">Добавить подозреваемого</a><br><br>
    <table border="1">
        <tr><th>ID</th><th>Имя</th><th>Возраст</th><th>Приметы</th><th>Действия</th></tr>
        {% for suspect in suspects %}
        <tr>
            <td>{{ suspect.id }}</td><td>{{ suspect.name }}</td><td>{{ suspect.age }}</td><td>{{ suspect.features }}</td>
            <td><a href="/update_suspect/{{ suspect.id }}">Редактировать</a> | <a href="/delete_suspect/{{ suspect.id }}">Удалить</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
