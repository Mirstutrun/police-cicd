<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Добавить дело</title></head>
<body>
    <h1>Добавление дела</h1>
    <a href="/cases">Назад к списку</a><br><br>
    <form action="/add_case" method="POST">
        <label>Название дела:</label><br><input type="text" name="title" required><br><br>
        <label>Статус:</label><br><input type="text" name="status" value="Открыто" required><br><br>
        <label>Ответственный офицер:</label><br>
        <select name="officer_id">
            {% for officer in officers %}<option value="{{ officer.id }}">{{ officer.name }}</option>{% endfor %}
        </select><br><br>
        <button type="submit">Добавить</button>
    </form>
</body>
</html>
